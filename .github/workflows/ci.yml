name: CI
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  packages: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      # first run only: make the ghcr package public (repo -> Packages -> webplatform)
      - uses: docker/login-action@v4
        if: github.event_name == 'push'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: Containerfile
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          load: true
          push: ${{ github.event_name == 'push' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test
        env:
          # version = highest-priority tag, always a single line
          # (meta.outputs.tags can be multiline, which would break docker run)
          IMAGE: ghcr.io/${{ github.repository }}:${{ steps.meta.outputs.version }}
        run: |
          docker run -d --name smoke "$IMAGE"
          sleep 2
          docker exec smoke clang --version
          docker exec smoke ninja --version
      - name: Core and examples check inside container
        run: |
          docker cp . smoke:/data/work/repo
          docker exec -w /data/work/repo smoke ./scripts/check.sh
      - name: E2E demo server check
        run: |
          docker exec -d -w /data/work/repo smoke build/examples/hello_server/src/hello_server
          sleep 1
          docker exec smoke curl -sf localhost:8080/plugin/hello | grep -q "plugin ok: hello"
          docker exec smoke curl -sf --compressed localhost:8080/ | grep -q htmx
          docker exec smoke sh -c 'curl -sf localhost:8080/htmx.min.js | gunzip | grep -q htmx'
          docker exec smoke sh -c '! curl -sf localhost:8080/plugin/../etc > /dev/null'
          docker exec smoke curl -si localhost:8080/nope | grep -q "404 Not Found"
          # metrics: first row lands after ~10 s (the first tick is the baseline)
          sleep 10
          docker exec smoke curl -sf 'localhost:8080/api/metrics?range=60' | grep -q '"ts":\['
          docker exec smoke curl -sf 'localhost:8080/api/metrics?range=abc' | grep -q '"cpu":\['
          docker exec smoke curl -sf --compressed localhost:8080/ | grep -q "metrics-chart"
          docker exec smoke curl -sf --compressed localhost:8080/uplot.iife.min.js | grep -q uPlot
